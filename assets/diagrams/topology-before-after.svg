<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Home lab topology before and after first OPNsense segmentation phase</title>
  <desc id="desc">Side-by-side diagram showing the original flat 192.168.1.0/24 home LAN and the later staged design with Linux Mint on 10.10.10.0/24 behind OPNsense.</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 28; ry: 28; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .subtitle { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #42506a; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #53627d; }
      .chip { fill: #edf2ff; stroke: #b7c6ec; stroke-width: 1.5; }
      .chip2 { fill: #eefaf4; stroke: #b9e3ca; stroke-width: 1.5; }
      .chip3 { fill: #fff3e6; stroke: #f1c18c; stroke-width: 1.5; }
      .chip4 { fill: #fbeef2; stroke: #e5b6c7; stroke-width: 1.5; }
      .chiptext { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #22304d; }
      .net { fill: #18243d; }
      .nettext { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .line { stroke: #51617e; stroke-width: 4; stroke-linecap: round; }
      .dash { stroke: #91a0bc; stroke-width: 4; stroke-dasharray: 12 12; stroke-linecap: round; }
      .blocked { stroke: #c23d4b; stroke-width: 4; stroke-linecap: round; }
      .allowed { stroke: #1a8d51; stroke-width: 4; stroke-linecap: round; }
      .note { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #5b6983; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="760"/>

  <text x="700" y="56" text-anchor="middle" class="title">Home Lab Topology: Before and After First Segmentation Phase</text>
  <text x="700" y="92" text-anchor="middle" class="subtitle">Flat production LAN before changes, then a staged routed lab segment behind OPNsense</text>

  <rect class="panel" x="36" y="126" width="644" height="592"/>
  <rect class="panel" x="720" y="126" width="644" height="592"/>

  <text x="76" y="170" class="title" style="font-size:30px;">Before</text>
  <text x="76" y="204" class="subtitle">Flat home LAN on 192.168.1.0/24</text>

  <rect class="net" x="230" y="238" width="250" height="64" rx="16" ry="16"/>
  <text x="355" y="278" text-anchor="middle" class="nettext">Spectrum Gateway 192.168.1.1</text>

  <line class="line" x1="355" y1="302" x2="355" y2="350"/>

  <rect class="chip" x="240" y="350" width="230" height="70" rx="18" ry="18"/>
  <text x="355" y="380" text-anchor="middle" class="chiptext">GS308EP Switch</text>
  <text x="355" y="403" text-anchor="middle" class="small">Mgmt: 192.168.1.117</text>

  <line class="line" x1="355" y1="420" x2="160" y2="492"/>
  <line class="line" x1="355" y1="420" x2="290" y2="492"/>
  <line class="line" x1="355" y1="420" x2="420" y2="492"/>
  <line class="line" x1="355" y1="420" x2="550" y2="492"/>

  <rect class="chip2" x="72" y="492" width="176" height="72" rx="18" ry="18"/>
  <text x="160" y="522" text-anchor="middle" class="chiptext">MAIN-PC</text>
  <text x="160" y="545" text-anchor="middle" class="small">192.168.1.167</text>

  <rect class="chip2" x="202" y="492" width="176" height="72" rx="18" ry="18"/>
  <text x="290" y="522" text-anchor="middle" class="chiptext">pi-core / Pi-hole</text>
  <text x="290" y="545" text-anchor="middle" class="small">192.168.1.224</text>

  <rect class="chip2" x="332" y="492" width="176" height="72" rx="18" ry="18"/>
  <text x="420" y="522" text-anchor="middle" class="chiptext">asus-server</text>
  <text x="420" y="545" text-anchor="middle" class="small">192.168.1.221</text>

  <rect class="chip2" x="462" y="492" width="176" height="72" rx="18" ry="18"/>
  <text x="550" y="522" text-anchor="middle" class="chiptext">Other Home Devices</text>
  <text x="550" y="545" text-anchor="middle" class="small">TV, printer, AP, clients</text>

  <text x="355" y="624" text-anchor="middle" class="note">All devices share one production subnet and broad east-west reachability.</text>

  <text x="760" y="170" class="title" style="font-size:30px;">After</text>
  <text x="760" y="204" class="subtitle">Linux Mint moved behind OPNsense on 10.10.10.0/24</text>

  <rect class="net" x="950" y="226" width="250" height="64" rx="16" ry="16"/>
  <text x="1075" y="266" text-anchor="middle" class="nettext">Spectrum Gateway 192.168.1.1</text>

  <rect class="chip3" x="916" y="336" width="320" height="112" rx="20" ry="20"/>
  <text x="1076" y="370" text-anchor="middle" class="chiptext">Qotom Firewall Running OPNsense</text>
  <text x="1076" y="396" text-anchor="middle" class="small">WAN: 192.168.1.x</text>
  <text x="1076" y="419" text-anchor="middle" class="small">LAN: 10.10.10.1/24</text>

  <line class="line" x1="1076" y1="290" x2="1076" y2="336"/>

  <rect class="chip4" x="776" y="354" width="96" height="76" rx="18" ry="18"/>
  <text x="824" y="386" text-anchor="middle" class="chiptext" style="font-size:15px;">LAN</text>
  <text x="824" y="408" text-anchor="middle" class="small">10.10.10.1</text>

  <line class="line" x1="872" y1="392" x2="916" y2="392"/>

  <rect class="chip2" x="748" y="500" width="190" height="78" rx="18" ry="18"/>
  <text x="843" y="531" text-anchor="middle" class="chiptext">Linux Mint Client</text>
  <text x="843" y="555" text-anchor="middle" class="small">10.10.10.100</text>

  <line class="line" x1="843" y1="500" x2="843" y2="430"/>

  <rect class="chip" x="1012" y="512" width="248" height="72" rx="18" ry="18"/>
  <text x="1136" y="542" text-anchor="middle" class="chiptext">Allowed Home-Lab Hosts</text>
  <text x="1136" y="565" text-anchor="middle" class="small">Pi-hole, ASUS, MAIN-PC</text>

  <rect class="chip4" x="1012" y="610" width="248" height="72" rx="18" ry="18"/>
  <text x="1136" y="640" text-anchor="middle" class="chiptext">Blocked Home-LAN Devices</text>
  <text x="1136" y="663" text-anchor="middle" class="small">TV, printer, unrelated clients</text>

  <line class="allowed" x1="1076" y1="448" x2="1136" y2="512"/>
  <line class="blocked" x1="1076" y1="448" x2="1136" y2="610"/>
  <line class="dash" x1="938" y1="539" x2="1012" y2="539"/>

  <text x="964" y="530" class="label" style="font-size:16px;">routed path</text>
  <text x="1004" y="476" class="label" style="font-size:16px; fill:#1a8d51;">allowed</text>
  <text x="1000" y="600" class="label" style="font-size:16px; fill:#c23d4b;">blocked</text>

  <text x="1042" y="712" text-anchor="middle" class="note">The rest of the house is still on 192.168.1.0/24, but the test client is no longer a flat-LAN peer.</text>
</svg>
